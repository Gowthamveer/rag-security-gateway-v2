services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rsg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rsg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsg -d rsg"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://rsg:${POSTGRES_PASSWORD}@db/rsg
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPSTREAM_URL: http://ollama:11434/v1
      MODEL: ${MODEL:-llama3.1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
volumes:
  pgdata:
  ollama:
